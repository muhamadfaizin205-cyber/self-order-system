<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Mie 99</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{--g:#1b7a3d;--g2:#25a550;--gl:#e6f4ea;--bg:#f5f6f8;--card:#fff;--text:#1a1a1a;--muted:#888;--red:#e53935}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:'Poppins',sans-serif;min-height:100vh}
header{background:var(--g);color:#fff;padding:18px 28px}header h1{font-size:22px;font-weight:800}
.wrap{padding:28px;max-width:1100px;margin:0 auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:28px}
.stat{background:var(--card);border-radius:12px;padding:20px;border:1px solid #eee}
.stat .label{font-size:13px;color:var(--muted)}.stat .value{font-size:26px;font-weight:800;margin-top:6px;color:var(--g)}
.tabs{display:flex;gap:8px;margin-bottom:18px}
.tab{padding:9px 20px;border-radius:20px;border:1px solid #ddd;background:var(--card);cursor:pointer;font-size:14px;font-family:inherit}
.tab.active{background:var(--g);color:#fff;border-color:var(--g);font-weight:600}
.panel{background:var(--card);border-radius:12px;border:1px solid #eee;overflow:hidden}
table{width:100%;border-collapse:collapse}th,td{padding:12px 14px;text-align:left;font-size:13px;border-bottom:1px solid #f0f0f0}
th{background:#fafafa;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.badge{padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600}
.b-PENDING{background:#fff3e0;color:#f5a623}.b-KITCHEN{background:#e3f2fd;color:#1976d2}
.b-DONE{background:#e8f5e9;color:var(--g)}.b-CANCELLED{background:#fce4ec;color:#c62828}
.toggle{cursor:pointer;padding:5px 12px;border-radius:8px;border:none;font-size:12px;font-weight:600;color:#fff;font-family:inherit}
.toggle.on{background:var(--g)}.toggle.off{background:#bbb}
.price-input{width:90px;padding:5px 8px;border:1px solid #ddd;border-radius:6px;font-size:13px;font-family:inherit}
.empty{padding:40px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header><h1>🍜 Mie 99 · Admin Panel</h1></header>
<div class="wrap">
  <div class="stats" id="stats"></div>
  <div class="tabs">
    <div class="tab active" onclick="switchTab('orders',this)">Pesanan</div>
    <div class="tab" onclick="switchTab('menu',this)">Kelola Menu</div>
  </div>
  <div class="panel" id="panel-orders"><div class="empty">Memuat...</div></div>
  <div class="panel" id="panel-menu" style="display:none"><div class="empty">Memuat...</div></div>
</div>

<script>
const SB_URL="https://lhcbbupqhpljhtcdrloy.supabase.co";
const SB_KEY="sb_publishable_uc3y6YCR6wSKCCEajArRgQ_U-1g0f_q";
const RID="11111111-1111-1111-1111-111111111111";
const sb=window.supabase.createClient(SB_URL,SB_KEY);
const rupiah=n=>"Rp"+Number(n).toLocaleString("id-ID");

async function loadStats(){
  const today=new Date();today.setHours(0,0,0,0);
  const{data}=await sb.from("orders").select("*").eq("restaurant_id",RID).gte("created_at",today.toISOString());
  const paid=(data||[]).filter(o=>["PAID","KITCHEN","DONE"].includes(o.status));
  const rev=paid.reduce((s,o)=>s+o.total_amount,0);
  document.getElementById("stats").innerHTML=`
    <div class="stat"><div class="label">Pendapatan Hari Ini</div><div class="value">${rupiah(rev)}</div></div>
    <div class="stat"><div class="label">Pesanan Dibayar</div><div class="value">${paid.length}</div></div>
    <div class="stat"><div class="label">Total Pesanan</div><div class="value">${(data||[]).length}</div></div>
    <div class="stat"><div class="label">Rata-rata / Pesanan</div><div class="value">${rupiah(paid.length?Math.round(rev/paid.length):0)}</div></div>`;
}

async function loadOrders(){
  const{data}=await sb.from("orders").select("*,tables(table_number)").eq("restaurant_id",RID).order("created_at",{ascending:false}).limit(100);
  const p=document.getElementById("panel-orders");
  if(!data||!data.length){p.innerHTML='<div class="empty">Belum ada pesanan.</div>';return;}
  p.innerHTML=`<table><tr><th>Waktu</th><th>Meja</th><th>Pelanggan</th><th>Bayar</th><th>Total</th><th>Status</th></tr>${data.map(o=>`<tr><td>${new Date(o.created_at).toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"})}</td><td><b>${o.tables?.table_number||"?"}</b></td><td>${o.customer_name}</td><td>${o.payment_method}</td><td><b>${rupiah(o.total_amount)}</b></td><td><span class="badge b-${o.status}">${o.status}</span></td></tr>`).join("")}</table>`;
}

async function loadMenu(){
  const{data}=await sb.from("menu_items").select("*,menu_categories(name)").eq("restaurant_id",RID).order("sort_order");
  const p=document.getElementById("panel-menu");
  if(!data||!data.length){p.innerHTML='<div class="empty">Belum ada menu.</div>';return;}
  p.innerHTML=`<table><tr><th>Nama</th><th>Kategori</th><th>Harga</th><th>Tersedia</th></tr>${data.map(i=>`<tr><td><b>${i.name}</b>${i.is_package?" 📦":""}</td><td>${i.menu_categories?.name||""}</td><td><input class="price-input" type="number" value="${i.base_price}" onchange="updatePrice('${i.id}',this.value)"></td><td><button class="toggle ${i.is_available?"on":"off"}" onclick="toggleAvail('${i.id}',${!i.is_available},this)">${i.is_available?"Tersedia":"Habis"}</button></td></tr>`).join("")}</table>`;
}

async function updatePrice(id,val){await sb.from("menu_items").update({base_price:parseInt(val,10)}).eq("id",id);}
async function toggleAvail(id,next,btn){
  await sb.from("menu_items").update({is_available:next}).eq("id",id);
  btn.className="toggle "+(next?"on":"off");btn.textContent=next?"Tersedia":"Habis";
  btn.setAttribute("onclick",`toggleAvail('${id}',${!next},this)`);
}

function switchTab(name,el){
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));el.classList.add("active");
  document.getElementById("panel-orders").style.display=name==="orders"?"block":"none";
  document.getElementById("panel-menu").style.display=name==="menu"?"block":"none";
}

sb.channel("admin-rt").on("postgres_changes",{event:"*",schema:"public",table:"orders"},()=>{loadStats();loadOrders();}).subscribe();

loadStats();loadOrders();loadMenu();setInterval(()=>{loadStats();loadOrders();},10000);
</script>
</body>
</html>
