<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kasir — Mie 99</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --g: #1b7a3d; --g2: #25a550; --gl: #e6f4ea;
    --bg: #f5f6f8; --card: #fff; --text: #1a1a1a; --muted: #888;
    --red: #e53935; --amber: #f5a623; --blue: #1565c0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Poppins', sans-serif; min-height: 100vh; }

  /* Header */
  .header { background: var(--g); color: #fff; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
  .header h1 { font-size: 20px; font-weight: 800; }
  .header-right { display: flex; align-items: center; gap: 12px; font-size: 13px; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #aaa; }
  .status-dot.on { background: #69f0ae; box-shadow: 0 0 6px #69f0ae; }

  /* Config bar */
  .config { padding: 12px 24px; background: var(--card); border-bottom: 1px solid #eee; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .config input { padding: 8px 12px; border-radius: 8px; border: 1px solid #ddd; font-size: 13px; font-family: inherit; }
  .config button { padding: 8px 18px; border: none; border-radius: 8px; background: var(--g); color: #fff; font-weight: 600; cursor: pointer; font-family: inherit; }
  .config button:active { transform: scale(.97); }

  /* Stats bar */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; padding: 20px 24px; }
  .stat-card { background: var(--card); border-radius: 14px; padding: 16px 18px; border: 1px solid #eee; }
  .stat-label { font-size: 12px; color: var(--muted); }
  .stat-value { font-size: 24px; font-weight: 800; margin-top: 4px; }
  .stat-value.green { color: var(--g); }
  .stat-value.amber { color: var(--amber); }
  .stat-value.blue { color: var(--blue); }

  /* Tabs */
  .tabs { display: flex; gap: 6px; padding: 0 24px 16px; }
  .tab { padding: 8px 20px; border-radius: 20px; border: 1px solid #ddd; background: var(--card); font-size: 13px; cursor: pointer; font-family: inherit; font-weight: 500; transition: all .2s; }
  .tab:active { transform: scale(.97); }
  .tab.active { background: var(--g); color: #fff; border-color: var(--g); font-weight: 600; }
  .tab .badge { display: inline-block; background: var(--red); color: #fff; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 10px; margin-left: 6px; }
  .tab.active .badge { background: rgba(255,255,255,.3); }

  /* Content area */
  .content { padding: 0 24px 24px; }
  .empty { text-align: center; padding: 60px; color: var(--muted); font-size: 15px; }

  /* Order cards */
  .orders-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; }
  .order-card { background: var(--card); border-radius: 14px; border: 1px solid #eee; overflow: hidden; transition: box-shadow .2s; }
  .order-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.06); }
  .order-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; background: #fafafa; border-bottom: 1px solid #f0f0f0; }
  .order-table { font-size: 22px; font-weight: 800; color: var(--g); }
  .order-meta { text-align: right; }
  .order-name { font-size: 13px; font-weight: 600; }
  .order-time { font-size: 11px; color: var(--muted); }
  .order-body { padding: 12px 16px; }
  .order-line { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #f8f8f8; font-size: 13px; }
  .order-line:last-child { border-bottom: none; }
  .line-name { font-weight: 600; }
  .line-mods { font-size: 11px; color: var(--muted); }
  .line-notes { font-size: 11px; color: var(--amber); font-style: italic; }
  .line-qty { color: var(--g); font-weight: 700; margin-right: 4px; }
  .order-foot { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-top: 1px solid #eee; }
  .order-total { font-weight: 800; font-size: 18px; }
  .order-method { font-size: 11px; padding: 3px 10px; border-radius: 6px; font-weight: 600; }
  .method-QRIS { background: #e3f2fd; color: var(--blue); }
  .method-CASHIER { background: #fff3e0; color: #e65100; }
  .order-actions { display: flex; gap: 8px; padding: 0 16px 14px; }
  .btn { padding: 10px 16px; border: none; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; transition: all .15s; flex: 1; }
  .btn:active { transform: scale(.97); }
  .btn-confirm { background: var(--g); color: #fff; }
  .btn-confirm:hover { background: var(--g2); }
  .btn-cancel { background: #fff; color: var(--red); border: 1.5px solid var(--red); }
  .btn-cancel:hover { background: #fff5f5; }
  .btn-print { background: var(--gl); color: var(--g); }

  /* Status badges */
  .badge-status { padding: 3px 10px; border-radius: 8px; font-size: 11px; font-weight: 600; display: inline-block; }
  .s-PENDING { background: #fff3e0; color: #e65100; }
  .s-KITCHEN { background: #e3f2fd; color: var(--blue); }
  .s-DONE { background: var(--gl); color: var(--g); }
  .s-CANCELLED { background: #fce4ec; color: var(--red); }

  /* History table */
  .history-table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 14px; overflow: hidden; border: 1px solid #eee; }
  .history-table th, .history-table td { padding: 12px 14px; text-align: left; font-size: 13px; border-bottom: 1px solid #f0f0f0; }
  .history-table th { background: #fafafa; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; font-weight: 600; }
  .history-table tr:hover td { background: #fafafa; }

  /* Walk-in modal */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 50; display: flex; align-items: center; justify-content: center; }
  .modal { background: var(--card); border-radius: 18px; width: 90%; max-width: 500px; max-height: 85vh; overflow-y: auto; padding: 24px; }
  .modal h2 { font-size: 18px; margin-bottom: 16px; }
  .modal input, .modal select { width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 10px; font-size: 14px; font-family: inherit; margin-bottom: 10px; outline: none; }
  .modal input:focus, .modal select:focus { border-color: var(--g); }

  /* Clock */
  .clock { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }

  @media (max-width: 600px) {
    .orders-grid { grid-template-columns: 1fr; }
    .stats { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<div class="header">
  <h1>🍜 Mie 99 · Kasir</h1>
  <div class="header-right">
    <span class="clock" id="clock">--:--:--</span>
    <span class="status-dot" id="ws-dot"></span>
  </div>
</div>

<div class="config">
  <label style="font-size:13px;">Restaurant ID:</label>
  <input id="resto-id" placeholder="Tempel dari hasil seed" style="flex:1; min-width:200px;">
  <label style="font-size:13px;">API:</label>
  <input id="api-url" value="http://localhost:4000" style="width:200px;">
  <button onclick="start()">Hubungkan</button>
  <button onclick="openWalkin()" style="background:#e65100;">+ Pesanan Walk-in</button>
</div>

<div class="stats" id="stats"></div>

<div class="tabs" id="tabs">
  <button class="tab active" onclick="switchTab('pending', this)">Menunggu Bayar <span class="badge" id="pending-count">0</span></button>
  <button class="tab" onclick="switchTab('active', this)">Aktif di Dapur <span class="badge" id="active-count">0</span></button>
  <button class="tab" onclick="switchTab('history', this)">Riwayat Hari Ini</button>
</div>

<div class="content" id="content">
  <div class="empty">Masukkan Restaurant ID lalu klik Hubungkan.</div>
</div>

<!-- Walk-in Modal -->
<div class="modal-overlay" id="walkin-modal" style="display:none;" onclick="closeWalkin()">
  <div class="modal" onclick="event.stopPropagation()">
    <h2>Pesanan Walk-in (Tanpa QR)</h2>
    <input id="wk-name" placeholder="Nama pelanggan *">
    <input id="wk-table" type="number" placeholder="Nomor meja *">
    <div id="wk-menu"></div>
    <div style="margin-top:14px; padding-top:14px; border-top:1px solid #eee;">
      <div style="display:flex; justify-content:space-between; font-size:15px; font-weight:700; margin-bottom:14px;">
        <span>Total</span><span id="wk-total">Rp0</span>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-cancel" onclick="closeWalkin()" style="flex:1;">Batal</button>
        <button class="btn btn-confirm" onclick="submitWalkin()" style="flex:1;">Buat Pesanan</button>
      </div>
    </div>
  </div>
</div>

<script>
let API = "http://localhost:4000";
let RESTO = "";
let currentTab = "pending";
let allOrders = [];
let menuItems = [];
let walkinCart = {}; // { itemId: { name, price, qty } }

const rupiah = n => "Rp" + Number(n).toLocaleString("id-ID");

// Clock
setInterval(() => {
  document.getElementById("clock").textContent = new Date().toLocaleTimeString("id-ID");
}, 1000);

// ========== DATA LOADING ==========
async function loadStats() {
  try {
    const res = await fetch(`${API}/api/v1/admin/stats?restaurantId=${RESTO}`);
    const s = await res.json();
    document.getElementById("stats").innerHTML = `
      <div class="stat-card"><div class="stat-label">Pendapatan Hari Ini</div><div class="stat-value green">${rupiah(s.todayRevenue)}</div></div>
      <div class="stat-card"><div class="stat-label">Pesanan Lunas</div><div class="stat-value blue">${s.paidOrders}</div></div>
      <div class="stat-card"><div class="stat-label">Total Pesanan</div><div class="stat-value">${s.totalOrders}</div></div>
      <div class="stat-card"><div class="stat-label">Rata-rata / Pesanan</div><div class="stat-value green">${rupiah(s.avgOrderValue)}</div></div>
    `;
  } catch (e) { console.error(e); }
}

async function loadOrders() {
  try {
    const res = await fetch(`${API}/api/v1/admin/orders?restaurantId=${RESTO}`);
    const data = await res.json();
    allOrders = data.orders || [];
    updateCounts();
    renderTab();
  } catch (e) { console.error(e); }
}

async function loadMenu() {
  try {
    const res = await fetch(`${API}/api/v1/restaurants/${RESTO}/menu`);
    const data = await res.json();
    menuItems = [];
    (data.categories || []).forEach(c => {
      c.items.forEach(it => menuItems.push({ id: it.id, name: it.name, price: it.basePrice, category: c.name }));
    });
  } catch (e) { console.error(e); }
}

function updateCounts() {
  const pending = allOrders.filter(o => o.status === "PENDING").length;
  const active = allOrders.filter(o => o.status === "KITCHEN" || o.status === "PAID").length;
  document.getElementById("pending-count").textContent = pending;
  document.getElementById("active-count").textContent = active;
}

// ========== TABS & RENDERING ==========
function switchTab(tab, btn) {
  currentTab = tab;
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  btn.classList.add("active");
  renderTab();
}

function renderTab() {
  const el = document.getElementById("content");
  if (currentTab === "pending") renderPending(el);
  else if (currentTab === "active") renderActive(el);
  else renderHistory(el);
}

function renderPending(el) {
  const orders = allOrders.filter(o => o.status === "PENDING");
  if (!orders.length) { el.innerHTML = '<div class="empty">Tidak ada pesanan menunggu bayar.</div>'; return; }
  el.innerHTML = '<div class="orders-grid">' + orders.map(o => orderCard(o, true)).join('') + '</div>';
}

function renderActive(el) {
  const orders = allOrders.filter(o => o.status === "KITCHEN" || o.status === "PAID");
  if (!orders.length) { el.innerHTML = '<div class="empty">Tidak ada pesanan aktif di dapur.</div>'; return; }
  el.innerHTML = '<div class="orders-grid">' + orders.map(o => orderCard(o, false)).join('') + '</div>';
}

function renderHistory(el) {
  const today = new Date().toLocaleDateString("id-ID");
  const orders = allOrders;
  if (!orders.length) { el.innerHTML = '<div class="empty">Belum ada pesanan hari ini.</div>'; return; }
  el.innerHTML = `
    <table class="history-table">
      <tr><th>Waktu</th><th>Meja</th><th>Pelanggan</th><th>Bayar</th><th>Total</th><th>Status</th></tr>
      ${orders.map(o => `<tr>
        <td>${new Date(o.createdAt).toLocaleTimeString("id-ID", {hour:"2-digit",minute:"2-digit"})}</td>
        <td><b>${o.tableNumber}</b></td>
        <td>${o.customerName}</td>
        <td><span class="order-method method-${o.paymentMethod}">${o.paymentMethod}</span></td>
        <td><b>${rupiah(o.totalAmount)}</b></td>
        <td><span class="badge-status s-${o.status}">${o.status}</span></td>
      </tr>`).join('')}
    </table>`;
}

function orderCard(o, showActions) {
  const time = new Date(o.createdAt).toLocaleTimeString("id-ID", {hour:"2-digit",minute:"2-digit"});
  const mins = Math.floor((Date.now() - new Date(o.createdAt)) / 60000);
  const waiting = mins <= 0 ? "baru" : `${mins} mnt`;

  return `
    <div class="order-card">
      <div class="order-head">
        <div class="order-table">Meja ${o.tableNumber}</div>
        <div class="order-meta">
          <div class="order-name">${o.customerName}</div>
          <div class="order-time">${time} · ${waiting}</div>
        </div>
      </div>
      <div class="order-body">
        ${(o.items || []).map(it => `
          <div class="order-line">
            <div>
              <div class="line-name"><span class="line-qty">${it.quantity || 1}×</span> ${it.name || 'Item'}</div>
              ${it.modifiers ? `<div class="line-mods">${it.modifiers}</div>` : ''}
              ${it.notes ? `<div class="line-notes">📝 ${it.notes}</div>` : ''}
            </div>
            <div style="font-weight:600;">${rupiah(it.totalPrice || 0)}</div>
          </div>
        `).join('')}
      </div>
      <div class="order-foot">
        <span class="order-method method-${o.paymentMethod}">${o.paymentMethod === 'CASHIER' ? '💵 Tunai/Kasir' : '📱 QRIS'}</span>
        <span class="order-total">${rupiah(o.totalAmount)}</span>
      </div>
      ${showActions ? `
        <div class="order-actions">
          <button class="btn btn-cancel" onclick="cancelOrder('${o.id}')">Batalkan</button>
          <button class="btn btn-confirm" onclick="confirmPayment('${o.id}')">✓ Konfirmasi Bayar</button>
        </div>
      ` : `
        <div class="order-actions">
          <button class="btn btn-print" onclick="printReceipt('${o.id}')">🖨️ Cetak Struk</button>
          <button class="btn btn-confirm" onclick="markDone('${o.id}')">✓ Selesai</button>
        </div>
      `}
    </div>`;
}

// ========== ACTIONS ==========
async function confirmPayment(id) {
  if (!confirm("Konfirmasi pembayaran untuk pesanan ini?")) return;
  try {
    await fetch(`${API}/api/v1/orders/${id}/simulate-paid`, { method: "POST" });
    loadOrders();
    loadStats();
  } catch (e) { alert("Gagal: " + e.message); }
}

async function markDone(id) {
  try {
    await fetch(`${API}/api/v1/kitchen/orders/${id}/done`, { method: "PATCH" });
    loadOrders();
    loadStats();
  } catch (e) { alert("Gagal: " + e.message); }
}

async function cancelOrder(id) {
  if (!confirm("Yakin batalkan pesanan ini?")) return;
  // In production, add a cancel endpoint. For now, we'll just refresh.
  alert("Fitur batalkan memerlukan endpoint tambahan di backend. Akan ditambahkan.");
}

function printReceipt(id) {
  const order = allOrders.find(o => o.id === id);
  if (!order) return;
  const win = window.open('', '', 'width=300,height=500');
  win.document.write(`
    <html><head><style>
      body { font-family: monospace; font-size: 12px; padding: 10px; width: 270px; }
      .center { text-align: center; }
      .line { border-top: 1px dashed #000; margin: 8px 0; }
      .row { display: flex; justify-content: space-between; }
      .bold { font-weight: bold; }
    </style></head><body>
      <div class="center"><b>MIE 99</b><br>Jl. Pahlawan No. 99, Mojokerto<br>0321-999999</div>
      <div class="line"></div>
      <div class="row"><span>Meja</span><span class="bold">${order.tableNumber}</span></div>
      <div class="row"><span>Customer</span><span>${order.customerName}</span></div>
      <div class="row"><span>Waktu</span><span>${new Date(order.createdAt).toLocaleString("id-ID")}</span></div>
      <div class="row"><span>Bayar</span><span>${order.paymentMethod}</span></div>
      ${order.queueNumber ? `<div class="row"><span>Antrean</span><span class="bold">${order.queueNumber}</span></div>` : ''}
      <div class="line"></div>
      <div class="row bold"><span>TOTAL</span><span>${rupiah(order.totalAmount)}</span></div>
      <div class="line"></div>
      <div class="center" style="margin-top:10px;">Terima kasih!<br>Selamat menikmati 🍜</div>
    </body></html>
  `);
  win.document.close();
  setTimeout(() => { win.print(); }, 300);
}

// ========== WALK-IN ORDER ==========
function openWalkin() {
  if (!RESTO) { alert("Hubungkan ke server dulu."); return; }
  walkinCart = {};
  document.getElementById("wk-name").value = "";
  document.getElementById("wk-table").value = "";
  renderWalkinMenu();
  document.getElementById("walkin-modal").style.display = "flex";
}

function closeWalkin() {
  document.getElementById("walkin-modal").style.display = "none";
}

function renderWalkinMenu() {
  const el = document.getElementById("wk-menu");
  if (!menuItems.length) {
    el.innerHTML = '<div style="color:#aaa; padding:16px; text-align:center;">Menu belum dimuat. Hubungkan ke server dulu.</div>';
    return;
  }

  let html = '<div style="margin-top:10px; max-height:300px; overflow-y:auto;">';
  let lastCat = "";
  menuItems.forEach(item => {
    if (item.category !== lastCat) {
      lastCat = item.category;
      html += `<div style="font-weight:700; font-size:13px; color:var(--g); margin:12px 0 6px; padding-top:8px; border-top:1px solid #eee;">${lastCat}</div>`;
    }
    const qty = walkinCart[item.id]?.qty || 0;
    html += `
      <div style="display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px solid #f5f5f5;">
        <div>
          <div style="font-weight:600; font-size:13px;">${item.name}</div>
          <div style="font-size:12px; color:var(--g); font-weight:600;">${rupiah(item.price)}</div>
        </div>
        <div style="display:flex; align-items:center; gap:8px;">
          ${qty > 0 ? `
            <button onclick="wkQty('${item.id}', -1)" style="width:28px;height:28px;border-radius:8px;border:1.5px solid var(--g);background:#fff;color:var(--g);cursor:pointer;font-size:16px;font-weight:700;">−</button>
            <span style="font-weight:700;min-width:18px;text-align:center;">${qty}</span>
          ` : ''}
          <button onclick="wkQty('${item.id}', 1)" style="width:28px;height:28px;border-radius:8px;border:none;background:var(--g);color:#fff;cursor:pointer;font-size:16px;font-weight:700;">+</button>
        </div>
      </div>`;
  });
  html += '</div>';
  el.innerHTML = html;
  updateWalkinTotal();
}

function wkQty(itemId, delta) {
  const item = menuItems.find(i => i.id === itemId);
  if (!item) return;
  if (!walkinCart[itemId]) walkinCart[itemId] = { name: item.name, price: item.price, qty: 0 };
  walkinCart[itemId].qty = Math.max(0, walkinCart[itemId].qty + delta);
  if (walkinCart[itemId].qty === 0) delete walkinCart[itemId];
  renderWalkinMenu();
}

function updateWalkinTotal() {
  const total = Object.values(walkinCart).reduce((s, i) => s + i.price * i.qty, 0);
  const tax = Math.round(total * 0.1);
  document.getElementById("wk-total").textContent = rupiah(total + tax);
}

async function submitWalkin() {
  const name = document.getElementById("wk-name").value.trim();
  const table = document.getElementById("wk-table").value.trim();
  const items = Object.entries(walkinCart).filter(([_, v]) => v.qty > 0);

  if (!name) { alert("Isi nama pelanggan."); return; }
  if (!table) { alert("Isi nomor meja."); return; }
  if (!items.length) { alert("Pilih minimal satu menu."); return; }

  // In production, this would POST to /api/v1/orders with a special walk-in token.
  // For now, show confirmation.
  const total = Object.values(walkinCart).reduce((s, i) => s + i.price * i.qty, 0);
  const tax = Math.round(total * 0.1);
  const itemList = items.map(([_, v]) => `${v.qty}× ${v.name}`).join(", ");

  alert(`Pesanan Walk-in dibuat!\n\nNama: ${name}\nMeja: ${table}\nItem: ${itemList}\nTotal: ${rupiah(total + tax)}\n\n(Pada mode produksi, pesanan akan masuk ke sistem dan KDS.)`);
  closeWalkin();
}

// ========== WEBSOCKET ==========
function connectWs() {
  const wsUrl = API.replace(/^http/, "ws") + "/ws";
  try {
    const ws = new WebSocket(wsUrl);
    ws.onopen = () => {
      ws.send(JSON.stringify({ type: "subscribe", channel: "kitchen" }));
      document.getElementById("ws-dot").classList.add("on");
    };
    ws.onmessage = () => { loadOrders(); loadStats(); };
    ws.onclose = () => {
      document.getElementById("ws-dot").classList.remove("on");
      setTimeout(connectWs, 3000);
    };
  } catch (e) { console.error(e); }
}

// ========== START ==========
function start() {
  RESTO = document.getElementById("resto-id").value.trim();
  API = document.getElementById("api-url").value.trim() || API;
  if (!RESTO) { alert("Isi Restaurant ID."); return; }
  loadStats();
  loadOrders();
  loadMenu();
  connectWs();
  setInterval(() => { loadStats(); loadOrders(); }, 10000);
}
</script>
</body>
</html>
